apiVersion: 1

datasources:
  - name:    Loki
    type:    loki
    uid:     loki
    url:     http://loki:3100
    access:  proxy
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      timeout:  60

  - name:    Pyroscope
    type:    grafana-pyroscope-datasource
    uid:     pyroscope
    url:     http://pyroscope:4040
    access:  proxy
    editable: false
