server:
  address: 'tcp://0.0.0.0:9100'

log:
  level: 'info'

authentication_backend:
  file:
    path: '/data/users_database.yml'
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

session:
  secret: 'file:///config/secrets/session_secret'
  cookies:
    - name: 'authelia_session'
      domain: 'youssefalhassan.com'
      authelia_url: 'https://auth.youssefalhassan.com'
      expiration: '1 hour'
      inactivity: '5 minutes'

storage:
  encryption_key: 'file:///config/secrets/storage_encryption_key'
  local:
    path: '/config/db.sqlite3'

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

notifier:
  filesystem:
    filename: '/config/notification.txt'

identity_validation:
  reset_password:
    jwt_secret: 'file:///config/secrets/jwt_secret'

identity_providers:
  oidc:
    hmac_secret: 'file:///config/secrets/oidc_hmac_secret'
    jwks:
      - algorithm: 'RS256'
        key: 'file:///config/secrets/oidc_private_key.pem'
    clients:
      - client_id: 'nextcloud'
        client_name: 'Nextcloud'
        # pbkdf2-sha512 hash of NC_OIDC_CLIENT_SECRET (see nextcloud/.env.example).
        # Regenerate with: authelia crypto hash generate pbkdf2 --password '<secret>'
        client_secret: 'CHANGEME_run_authelia_crypto_hash_generate_pbkdf2'
        public: false
        authorization_policy: 'one_factor'
        redirect_uris:
          - 'https://cloud.youssefalhassan.com/apps/user_oidc/code'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.youssefalhassan.com'
      policy: 'bypass'
    - domain: 'cloud.youssefalhassan.com'
      policy: 'bypass'
    - domain:
        - 'proxy.youssefalhassan.com'
        - 'grafana.youssefalhassan.com'
      policy: 'one_factor'
